<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pointcept 全程复习 · Step 0→5</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a21;
    --panel2: #1c212b;
    --border: #2a3140;
    --text: #d7dce4;
    --muted: #8a93a3;
    --accent: #4f9cf9;
    --accent2: #37c9a3;
    --warn: #f0b429;
    --danger: #f97066;
    --purple: #b58cf9;
    --code-bg: #10131a;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.7;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 20px 80px; }

  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-size: 20px; font-weight: 600; }
  h1 small { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 10px; }
  .spacer { flex: 1; }
  button.btn {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 14px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  button.btn:hover { border-color: var(--accent); color: var(--accent); }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.btn.primary:hover { filter: brightness(1.1); color: #fff; }

  .overall { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 18px; }
  .overall .row { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; flex-wrap: wrap; }
  .overall .row:last-child { margin-bottom: 0; }
  .overall .stat { font-size: 13px; color: var(--muted); }
  .overall .stat b { color: var(--text); font-size: 15px; }
  .overall .stat b.good { color: var(--accent2); }
  .overall .stat b.bad { color: var(--danger); }
  .bar { flex: 1; min-width: 200px; height: 10px; background: var(--code-bg); border-radius: 5px; overflow: hidden; }
  .bar > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .4s; }

  nav.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  nav.tabs button {
    background: var(--panel); border: 1px solid var(--border); color: var(--muted);
    padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; font-family: inherit;
  }
  nav.tabs button.active { border-color: var(--accent); color: var(--accent); background: rgba(79,156,249,.08); }
  nav.tabs button .cnt { font-size: 11px; margin-left: 6px; color: var(--muted); }

  .group-intro { background: var(--panel); border-left: 3px solid var(--accent); border-radius: 6px; padding: 12px 16px; margin-bottom: 18px; font-size: 14px; color: var(--muted); }
  .group-intro b { color: var(--text); }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 16px; overflow: hidden; }
  .card.done { border-color: rgba(55,201,163,.45); }
  .card.wrong { border-color: rgba(249,112,102,.45); }
  .card-head { display: flex; align-items: center; gap: 10px; padding: 13px 18px; cursor: pointer; user-select: none; }
  .card-head .qno { font-size: 12px; color: var(--muted); background: var(--code-bg); padding: 2px 8px; border-radius: 4px; white-space: nowrap; font-family: Consolas, monospace; }
  .card-head .qtitle { font-weight: 600; flex: 1; }
  .chev { color: var(--muted); font-size: 12px; transition: transform .2s; }
  .card.open .chev { transform: rotate(90deg); }
  .card.flash { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,156,249,.25); }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
  .badge.todo { background: rgba(140,147,163,.15); color: var(--muted); }
  .badge.seen { background: rgba(240,180,41,.15); color: var(--warn); }
  .badge.ok { background: rgba(55,201,163,.15); color: var(--accent2); }
  .badge.bad { background: rgba(249,112,102,.15); color: var(--danger); }

  .tchip { font-size: 11px; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
  .tchip.mc   { background: rgba(79,156,249,.15); color: var(--accent); }
  .tchip.tf   { background: rgba(181,140,249,.15); color: var(--purple); }
  .tchip.qa   { background: rgba(55,201,163,.15); color: var(--accent2); }
  .tchip.code { background: rgba(240,180,41,.15); color: var(--warn); }

  .card-body { display: none; padding: 0 18px 18px; border-top: 1px solid var(--border); }
  .card.open .card-body { display: block; }

  .prompt { margin: 14px 0; }
  pre.code {
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; font-family: Consolas, "Cascadia Mono", monospace; font-size: 12.5px;
    overflow-x: auto; line-height: 1.55; color: #a9d1ff; margin: 8px 0;
  }
  .hint { color: var(--muted); font-size: 13px; margin: 6px 0; }
  .hint b { color: var(--warn); }

  .mode-tabs { display: flex; gap: 0; margin: 12px 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; width: fit-content; }
  .mode-tabs button { background: transparent; border: none; color: var(--muted); padding: 7px 18px; cursor: pointer; font-size: 13px; font-family: inherit; }
  .mode-tabs button.active { background: var(--accent); color: #fff; }

  .opts { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
  .opt {
    display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px;
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
    cursor: pointer; font-size: 14px; transition: border-color .15s;
  }
  .opt:hover { border-color: var(--accent); }
  .opt.picked { border-color: var(--accent); background: rgba(79,156,249,.08); }
  .opt.right { border-color: var(--accent2); background: rgba(55,201,163,.08); }
  .opt.wrongpick { border-color: var(--danger); background: rgba(249,112,102,.08); }
  .opt.locked { cursor: default; }
  .opt .tag {
    font-family: Consolas, monospace; font-size: 12px; color: var(--muted);
    background: var(--panel2); border-radius: 4px; padding: 1px 7px; margin-top: 2px; flex-shrink: 0;
  }
  .opt.right .tag { color: var(--accent2); }
  .opt.wrongpick .tag { color: var(--danger); }

  .tfbtns { display: flex; gap: 12px; margin: 12px 0; }
  .tfbtns .opt { flex: 1; justify-content: center; align-items: center; padding: 12px; font-weight: 600; }

  .scoreline { display: flex; align-items: center; gap: 14px; margin-top: 12px; flex-wrap: wrap; }

  .verdict { margin-top: 12px; padding: 12px 16px; border-radius: 8px; font-size: 14px; }
  .verdict.pass { background: rgba(55,201,163,.08); border: 1px solid rgba(55,201,163,.4); }
  .verdict.fail { background: rgba(249,112,102,.08); border: 1px solid rgba(249,112,102,.4); }
  .verdict b.pass-t { color: var(--accent2); }
  .verdict b.fail-t { color: var(--danger); }
  .verdict .exp { margin-top: 8px; border-top: 1px dashed var(--border); padding-top: 8px; color: var(--text); }
  .verdict .exp code { background: var(--code-bg); padding: 1px 6px; border-radius: 4px; font-size: 12.5px; color: #a9d1ff; font-family: Consolas, monospace; }
  .verdict .exp pre {
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 12px; font-family: Consolas, monospace; font-size: 12px; overflow-x: auto; margin: 6px 0;
    color: #a9d1ff; line-height: 1.5;
  }

  textarea.answer {
    width: 100%; min-height: 110px; background: var(--code-bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 12px;
    font-family: inherit; font-size: 14px; line-height: 1.6; resize: vertical;
  }
  textarea.answer:focus { outline: none; border-color: var(--accent); }
  textarea.answer.mono { font-family: Consolas, "Cascadia Mono", monospace; font-size: 13px; }
  textarea.answer.tall { min-height: 160px; }

  .ref { margin-top: 14px; border: 1px dashed var(--border); border-radius: 8px; padding: 14px 16px; background: rgba(79,156,249,.03); }
  .ref h4 { font-size: 13px; color: var(--accent); margin-bottom: 8px; }
  .ref .body { font-size: 14px; }
  .ref .body p { margin-bottom: 8px; }
  .ref .body code { background: var(--code-bg); padding: 1px 6px; border-radius: 4px; font-size: 12.5px; color: #a9d1ff; font-family: Consolas, monospace; }
  .ref .body pre {
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 12px; font-family: Consolas, monospace; font-size: 12px; overflow-x: auto; margin: 6px 0;
    color: #a9d1ff; line-height: 1.5;
  }

  .points { margin-top: 12px; }
  .points h4 { font-size: 13px; color: var(--warn); margin-bottom: 6px; }
  .points label { display: flex; gap: 10px; align-items: flex-start; padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 13.5px; }
  .points label:hover { background: rgba(255,255,255,.03); }
  .points input[type=checkbox] { accent-color: var(--accent2); margin-top: 4px; }
  .points .hit { color: var(--accent2); }
  .points .miss { color: var(--muted); }

  .score-big { font-size: 22px; font-weight: 700; color: var(--accent2); }
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  @media (max-width: 720px) { .compare { grid-template-columns: 1fr; } }
  .compare .col h5 { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .compare .col .txt { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 13px; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }

  .kmap { margin-top: 10px; border: 1px dashed rgba(181,140,249,.4); border-radius: 8px; padding: 10px 14px; background: rgba(181,140,249,.04); }
  .kmap h4 { font-size: 12.5px; color: var(--purple); margin-bottom: 6px; }
  .kmap .krow { display: flex; gap: 10px; font-size: 13px; margin-bottom: 4px; align-items: baseline; }
  .kmap .krow .k { color: var(--muted); flex-shrink: 0; width: 76px; }
  .kmap code { background: var(--code-bg); padding: 1px 6px; border-radius: 4px; font-size: 12px; color: #a9d1ff; font-family: Consolas, monospace; }

  .chip {
    display: inline-block; font-family: Consolas, monospace; font-size: 11.5px;
    padding: 1px 9px; border-radius: 10px; cursor: pointer; margin: 1px 2px 1px 0;
    background: var(--code-bg); border: 1px solid var(--border); color: var(--muted);
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.c-ok   { border-color: rgba(55,201,163,.5);  color: var(--accent2); background: rgba(55,201,163,.08); }
  .chip.c-bad  { border-color: rgba(249,112,102,.5); color: var(--danger);  background: rgba(249,112,102,.08); }
  .chip.c-seen { border-color: rgba(240,180,41,.5);  color: var(--warn);    background: rgba(240,180,41,.08); }
  .chip.c-mid  { border-color: rgba(181,140,249,.5); color: var(--purple);  background: rgba(181,140,249,.08); }

  .flow h3.sec { color: var(--accent); font-size: 15px; margin: 22px 0 10px; }
  .flow h3.sec.test { color: var(--purple); }
  .flow .stage { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 8px; padding: 10px 14px; }
  .flow .flowwrap.test .stage { border-left-color: var(--purple); }
  .flow .stage .t { font-weight: 600; font-size: 14px; }
  .flow .stage .f { font-family: Consolas, monospace; font-size: 11.5px; color: var(--muted); font-weight: 400; margin-left: 8px; }
  .flow .stage .d { font-size: 13px; color: var(--muted); margin: 2px 0 4px; }
  .flow .stage .qs { margin-top: 2px; }
  .flow .arrow { text-align: center; color: var(--muted); font-size: 13px; margin: 4px 0; }

  .lesson { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--accent2); border-radius: var(--radius); margin-bottom: 18px; }
  .lesson-head { display: flex; align-items: center; gap: 10px; padding: 13px 18px; cursor: pointer; user-select: none; }
  .lesson-head .lt { font-weight: 600; flex: 1; color: var(--accent2); font-size: 15px; }
  .lesson.open .chev { transform: rotate(90deg); }
  .lesson-body { display: none; padding: 2px 20px 16px; border-top: 1px solid var(--border); }
  .lesson.open .lesson-body { display: block; }
  .lesson h4 { color: var(--accent); font-size: 14px; margin: 16px 0 8px; }
  .lesson p { margin-bottom: 8px; font-size: 14px; }
  .lesson pre.code { margin: 8px 0 12px; }
  .lesson code { background: var(--code-bg); padding: 1px 6px; border-radius: 4px; font-size: 12.5px; color: #a9d1ff; font-family: Consolas, monospace; }
  .lesson table { border-collapse: collapse; width: 100%; margin: 10px 0 14px; font-size: 13px; }
  .lesson th, .lesson td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top; }
  .lesson th { color: var(--muted); font-weight: 600; background: var(--code-bg); white-space: nowrap; }
  .lesson .note { background: rgba(240,180,41,.06); border: 1px dashed rgba(240,180,41,.4); border-radius: 8px; padding: 10px 14px; margin: 10px 0; font-size: 13.5px; }
  .lesson .exam { background: rgba(181,140,249,.06); border: 1px dashed rgba(181,140,249,.45); border-radius: 8px; padding: 10px 14px; margin: 14px 0 4px; font-size: 13.5px; line-height: 1.9; }
  .lesson .exam h5 { color: var(--purple); font-size: 13px; margin-bottom: 4px; }

  /* ── 💬 问答窗口（讲解/题目下方的 Claude 答疑） ── */
  .chatbox { margin-top: 14px; border: 1px dashed rgba(79,156,249,.45); border-radius: 8px; background: rgba(79,156,249,.03); }
  .chatbox-head { display: flex; align-items: center; gap: 8px; padding: 9px 14px; cursor: pointer; user-select: none; font-size: 13px; color: var(--accent); }
  .chatbox-head .chev { color: var(--muted); font-size: 12px; transition: transform .2s; }
  .chatbox.open .chev { transform: rotate(90deg); }
  .chatbox-head .sub { color: var(--muted); font-size: 12px; flex: 1; }
  .chatbox-body { display: none; padding: 4px 14px 14px; border-top: 1px solid var(--border); }
  .chatbox.open .chatbox-body { display: block; }
  .chat-msgs { max-height: 420px; overflow-y: auto; margin: 10px 0; display: flex; flex-direction: column; gap: 10px; }
  .cmsg { border-radius: 8px; padding: 9px 13px; font-size: 13.5px; line-height: 1.75; }
  .cmsg.user { background: rgba(79,156,249,.08); border: 1px solid rgba(79,156,249,.3); align-self: flex-end; max-width: 88%; white-space: pre-wrap; }
  .cmsg.bot { background: var(--code-bg); border: 1px solid var(--border); align-self: stretch; }
  .cmsg.bot .who { font-size: 11px; color: var(--accent2); margin-bottom: 4px; font-family: Consolas, monospace; }
  .cmsg.err { background: rgba(249,112,102,.07); border: 1px solid rgba(249,112,102,.35); color: var(--danger); font-size: 13px; }
  .cmsg.bot p { margin-bottom: 7px; }
  .cmsg.bot p:last-child { margin-bottom: 0; }
  .cmsg.bot ul, .cmsg.bot ol { margin: 4px 0 8px 20px; }
  .cmsg.bot li { margin-bottom: 3px; }
  .cmsg.bot code { background: var(--panel2); padding: 1px 6px; border-radius: 4px; font-size: 12px; color: #a9d1ff; font-family: Consolas, monospace; }
  .cmsg.bot pre { background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; font-family: Consolas, "Cascadia Mono", monospace; font-size: 12px; overflow-x: auto; margin: 6px 0; color: #a9d1ff; line-height: 1.5; }
  .cmsg.bot pre code { background: none; padding: 0; color: inherit; }
  .cmsg.bot h4 { color: var(--accent); font-size: 13.5px; margin: 8px 0 4px; }
  .cmsg.bot strong { color: var(--text); }
  .chatbar { display: flex; gap: 8px; }
  .chatbar textarea {
    flex: 1; min-height: 44px; max-height: 160px; background: var(--code-bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px;
    font-family: inherit; font-size: 13.5px; line-height: 1.55; resize: none;
  }
  .chatbar textarea:focus { outline: none; border-color: var(--accent); }
  .chatbar button.send {
    background: var(--accent); border: none; color: #fff; border-radius: 8px;
    padding: 0 18px; cursor: pointer; font-size: 13px; font-family: inherit; white-space: nowrap;
  }
  .chatbar button.send:hover { filter: brightness(1.1); }
  .chatbar button.send:disabled { opacity: .45; cursor: default; }
  .chat-empty-hint { color: var(--muted); font-size: 12.5px; padding: 2px 2px 0; }
  .chat-wait { align-self: stretch; background: var(--code-bg); border: 1px dashed var(--border); border-radius: 8px; padding: 9px 13px; font-size: 13px; color: var(--muted); }
  .chat-wait .dots::after { content: ""; animation: chatdots 1.2s steps(4) infinite; }
  @keyframes chatdots { 0% { content: ""; } 25% { content: "·"; } 50% { content: "··"; } 75% { content: "···"; } }

  footer { margin-top: 30px; color: var(--muted); font-size: 12px; text-align: center; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--accent); color: var(--text); padding: 10px 20px; border-radius: 8px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 99; }
  .toast.show { opacity: 1; }
</style>
</head>

<div class="wrap">
  <header>
    <h1>Pointcept 全程复习 · Step 0→5<small>知识点讲解 → 仓库代码 → 考察题目 · 9 章 · 先读讲解再做题</small></h1>
    <div class="spacer"></div>
    <button class="btn" onclick="exportRecord()">导出学习记录</button>
    <button class="btn" onclick="resetAll()" style="color:var(--danger)">清空重置</button>

  <div class="overall">

      <div class="stat">总进度 <b id="ov-done">0</b>/<b id="ov-total">0</b></div>

<script>
/* ══════════════════════════════════════════════════════════════
   全程复习题库：9 章（Step 0→5 学过的一切），每章 = 讲解 + 代码例子 + 题目
   mc 单选 / tf 判断（自动判分）· qa 问答（要点自评）· code 代码（输出比对）
   ══════════════════════════════════════════════════════════════ */
const GROUPS = [
{
  id: "overview", name: "🗺 全程地图", desc: "",
  questions: []
},
{
  id: "s1", name: "S1 · 点云初见", desc: "<b>Step 0/1</b>：环境工具链 + 第一次亲手摸点云。本章回答：点云是什么数据、和图像差在哪、领域第一问题是什么。",
  lesson: {
    title: "📖 讲解 · 点云是什么，领域第一问题是什么",
    html: `
<h4>知识点总结</h4>
<p><b>LiDAR 是极坐标传感器</b>：绕 z 轴 360° 旋转打线，每条线一个仰角。角度分辨率固定、距离越远弧长越大 → 点分布<b>不均匀</b>。一帧 SemanticKITTI 约 <b>12 万个点</b>（64 线）。</p>
<p><b>内存表示</b>：一帧点云就是一个 <code>[N,3]</code> 数组（每点 xyz）；LiDAR 额外带反射强度，磁盘上每点是 <code>[N,4]</code>（x,y,z,strength）。和图像的本质区别：点云<b>无序、无网格拓扑、点数逐帧变化</b>——没有 index buffer，不能像图像那样直接滑窗卷积。<b>这就是整个领域的出发点。</b></p>
<p><b>语义分割任务</b>：给每个点预测一个类别标签 → 输出 <code>segment[N]</code>（SemanticKITTI 19 类）。可视化上"练习按高度假着色 → 训练好的模型按语义类别着色"。</p>
<h4>仓库代码例子 1 · step1_touch_pointcloud.py（模拟一帧扫描）</h4>
<pre class="code">rng = np.random.default_rng(42)            # 种子：同种子必产同序列（可复现）
n = 120000                                  # 一帧 SemanticKITTI 约 12 万点

r = np.sqrt(rng.uniform(0, 1, n)) * 35.0   # 距离 0~35m
z = rng.uniform(-2.0, 3.0, n)              # 高度展开

x = r * np.cos(angles)
y = r * np.sin(angles)
coord = np.stack([x, y, z], axis=1)        # [N, 3] —— 点云的全部"几何"

pcd = o3d.geometry.PointCloud()
pcd.points = o3d.utility.Vector3dVector(coord)   # numpy 数组喂给 open3d
o3d.visualization.draw_geometries([pcd])         # 弹出可旋转 3D 窗口</pre>

<p><code>CE(loss_weight=1.0, class_weight=[...19 数组...])</code> + <code>LovaszLoss(mode="multiclass", loss_weight=2.0)</code>（lovasz.py:22 / builder.py:26）。<b>class_weight 处理类别不均衡</b>：vegetation 1.3212 最低（类大、样本多）……motorcyclist 10.1922 最高（类小、样本稀有）——稀有类权重大 10 倍，防止网络"只学会大路货"。<b>Lovasz 直接优化 IoU</b>（评测指标），与 CE 的逐点交叉熵互补：CE 管"每个点判对"，Lovasz 管"整块区域分割质量"。</p>
<h4>块④ misc 与评估节奏</h4>
<p><code>epoch=50, eval_epoch=50</code> 且 loop=1 → <b>每个 epoch 都评估+存档一次，共 50 次</b>（defaults.py:122 / evaluator.py:164 / misc.py:173 的链路；勘误：不是"只评估 1 次"）。<code>batch_size=8</code> 是全局总 batch（defaults.py:135，多卡会分摊）。<code>AdamW lr=0.002 wd=0.005 + OneCycleLR</code> 调度（先升后降）。<code>weight=["ce_loss", "lovasz_loss"]</code>——两损失加权求和进 backward。</p>

try { record = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch (e) { record = {}; }
function save() { localStorage.setItem(LS_KEY, JSON.stringify(record)); }

function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ── 输出比对：抽数字序列按容差比，退化为去空白字符串比 ── */
function gradeOutput(user, expected) {
  const nums = s => (String(s).match(/-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g) || []).map(Number);
  const a = nums(user), b = nums(expected);
  if (a.length === b.length && a.length > 0) {
    return a.every((v, i) => Math.abs(v - b[i]) <= 1e-6 * Math.max(1, Math.abs(b[i])));
  }
  const norm = s => String(s).replace(/\s+/g, " ").trim().toLowerCase();
  return norm(user) === norm(expected);
}

/* ── 顶栏统计 ── */
function renderOverall() {
  const total = ALL_Q.length;
  const done = ALL_Q.filter(q => record[q.id]).length;
  const seen = ALL_Q.filter(q => record[q.id] && record[q.id].mode === "seen").length;
  const objQs = ALL_Q.filter(q => record[q.id] && record[q.id].mode === "done" && (record[q.id].kind === "mc" || record[q.id].kind === "tf" || record[q.id].kind === "code"));
  const objOk = objQs.filter(q => record[q.id].correct).length;
  const qaQs = ALL_Q.filter(q => record[q.id] && record[q.id].mode === "done" && record[q.id].kind === "qa" && record[q.id].points);
  let qaTxt = "–";
  if (qaQs.length) {
    let hit = 0, all = 0;
    qaQs.forEach(q => { hit += record[q.id].points.filter(Boolean).length; all += record[q.id].points.length; });
    qaTxt = Math.round(hit / all * 100) + "% (" + qaQs.length + "题)";
  }
  document.getElementById("ov-total").textContent = total;
  document.getElementById("ov-done").textContent = done;
  document.getElementById("ov-seen").textContent = seen;
  const objEl = document.getElementById("ov-obj");
  objEl.textContent = objQs.length ? objOk + "/" + objQs.length : "–";
  objEl.className = objQs.length ? (objOk === objQs.length ? "good" : "bad") : "";
  document.getElementById("ov-qa").textContent = qaTxt;
  document.getElementById("ov-bar").style.width = (done / total * 100) + "%";
}

/* ── Tabs ── */
function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = GROUPS.map(g => {
    const done = g.questions.filter(q => record[q.id]).length;
    const cnt = g.questions.length ? `<span class="cnt">${done}/${g.questions.length}</span>` : "";
    return `<button class="${g.id===activeGroup?'active':''}" onclick="switchGroup('${g.id}')">${g.name}${cnt}</button>`;
  }).join("");
}

/* ── 状态徽章 ── */
function badgeOf(q) {
  const r = record[q.id];
  if (!r) return `<span class="badge todo">未开始</span>`;
  if (r.mode === "seen") return `<span class="badge seen">已看答案</span>`;
  if (r.kind === "qa") {
    if (!r.points) return `<span class="badge todo">已作答待评分</span>`;
    const hit = r.points.filter(Boolean).length;
    return `<span class="badge ${hit === r.points.length ? 'ok' : 'seen'}">自测 ${hit}/${r.points.length}</span>`;
  }
  return r.correct ? `<span class="badge ok">✓ 答对</span>` : `<span class="badge bad">✗ 答错</span>`;
}
function cardClass(q) {
  const r = record[q.id];
  if (!r) return "";
  if (r.mode === "done" && r.kind !== "qa") return r.correct ? ' done' : ' wrong';
  if (r.mode === "done" && r.kind === "qa" && r.points && r.points.every(Boolean)) return ' done';
  return "";
}

/* ── 章节讲解（先讲解、后习题） ── */
function lessonBlock(g) {
  const open = (window._lessonOpen || {})[g.id] ? " open" : "";
  return `
  <div class="lesson${open}" id="lesson-${g.id}">
    <div class="lesson-head" onclick="toggleLesson('${g.id}')">
      <span class="lt">${g.lesson.title}</span>
      <span class="chev">▶</span>
    </div>
    <div class="lesson-body">${g.lesson.html}${chatBlock("lesson", g.id)}</div>
  </div>`;
}
function toggleLesson(gid) {
  if (!window._lessonOpen) window._lessonOpen = {};
  window._lessonOpen[gid] = !window._lessonOpen[gid];
  const el = document.getElementById("lesson-" + gid);
  if (el) el.classList.toggle("open");
}

/* ── 题目卡片 ── */
function renderContent() {
  const g = GROUPS.find(x => x.id === activeGroup);
  const el = document.getElementById("content");
  if (g.id === "overview") { el.innerHTML = renderJourney(); return; }
  let html = `<div class="group-intro">${g.desc}</div>`;
  if (g.lesson) html += lessonBlock(g);
  html += g.questions.map(q => {
    const isOpen = (window._openCards || {}).has(q.id) ? " open" : "";
    return `
    <div class="card${cardClass(q)}${isOpen}" id="card-${q.id}">
      <div class="card-head" onclick="toggleCard('${q.id}')">
        <span class="qno">${q.id}</span>
        <span class="tchip ${q.type}">${TYPE_NAME[q.type]}</span>
        <span class="qtitle">${q.title}</span>
        ${badgeOf(q)}
        <span class="chev">▶</span>
      </div>
      <div class="card-body">
        <div class="prompt">${q.prompt}</div>
        ${q.code ? `<pre class="code">${esc(q.code)}</pre>` : ""}

          <button class="${!(window._mode||{})[q.id]||(window._mode||{})[q.id]==='self'?'active':''}" onclick="setMode('${q.id}','self')">✍ 自己作答</button>
          <button class="${(window._mode||{})[q.id]==='seen'?'active':''}" onclick="setMode('${q.id}','seen')">👀 直接看答案</button>
        </div>
        <div id="zone-${q.id}"></div>
        ${chatBlock("q", q.id)}
      </div>
    </div>`;
  }).join("");

  g.questions.forEach(q => renderZone(q));
  // renderContent 重建了 DOM，把已展开的 💬 问答窗内容补回来（历史在 window._chat 里）
  if (g.lesson && chatState("lesson:" + g.id).open) renderChatBody("lesson", g.id);
  g.questions.forEach(q => { if (chatState("q:" + q.id).open) renderChatBody("q", q.id); });
}

function currentMode(qid) { return (window._mode||{})[qid] || "self"; }
function setMode(qid, m) { window._mode[qid] = m; renderContent(); }
function toggleCard(qid) {
  const card = document.getElementById("card-" + qid);
  if (card.classList.contains("open")) { card.classList.remove("open"); window._openCards.delete(qid); }
  else { card.classList.add("open"); window._openCards.add(qid); }
}

/* ── 每题作答区（按题型分发） ── */
function renderZone(q) {
  const zone = document.getElementById("zone-" + q.id);
  if (!zone) return;
  const mode = currentMode(q.id);
  if (mode === "seen") {
    zone.innerHTML = `
      ${refBlock(q)}
      <div class="scoreline">
        <button class="btn primary" onclick="markSeen('${q.id}')">✓ 记为已看（算完成）</button>
        ${record[q.id] ? "" : `<span class="hint">看答案完成的题计入进度，但不计分</span>`}
      </div>`;
    return;
  }
  if (q.type === "mc") return renderMC(zone, q);
  if (q.type === "tf") return renderTF(zone, q);
  if (q.type === "code") return renderCode(zone, q);
  return renderQA(zone, q);
}

/* ── 单选题 ── */
function renderMC(zone, q) {
  const r = record[q.id];
  const submitted = r && r.mode === "done";
  const picked = submitted ? r.choice : (window._pick[q.id] ?? null);
  const opts = q.options.map((o, i) => {
    let cls = "opt";
    if (!submitted) cls += (picked === i ? " picked" : "");
    else {
      cls += " locked";
      if (i === q.correct) cls += " right";
      else if (i === r.choice) cls += " wrongpick";
    }
    return `<div class="${cls}" ${submitted ? "" : `onclick="pickMC('${q.id}',${i})"`}><span class="tag">${"ABCD"[i]}</span><span>${o}</span></div>`;
  }).join("");
  zone.innerHTML = `
    <div class="opts">${opts}</div>
    ${submitted ? verdictBlock(q, r) : `
    <div class="scoreline">
      <button class="btn primary" ${picked == null ? "disabled" : ""} onclick="submitMC('${q.id}')">提交答案</button>
      ${picked == null ? `<span class="hint">先选一个选项</span>` : ""}
    </div>`}`;
}

function pickMC(qid, i) { window._pick[qid] = i; renderZone(QMAP[qid]); }
function submitMC(qid) {
  const q = QMAP[qid];
  const choice = window._pick[qid];
  if (choice == null) return;
  record[qid] = { mode: "done", kind: "mc", choice, correct: choice === q.correct, ts: Date.now() };
  save(); refresh();
  toastChoice(qid);
}

/* ── 判断题 ── */
function renderTF(zone, q) {
  const r = record[q.id];
  const submitted = r && r.mode === "done";
  const picked = submitted ? r.choice : (window._pick[q.id] ?? null);
  const opts = [
    { v: true,  label: "✓ 对" },
    { v: false, label: "✗ 错" }
  ].map((o, i) => {
    let cls = "opt";
    if (!submitted) cls += (picked === o.v ? " picked" : "");
    else {
      cls += " locked";
      if (o.v === q.answer) cls += " right";
      else if (o.v === r.choice) cls += " wrongpick";
    }
    return `<div class="${cls}" ${submitted ? "" : `onclick="pickTF('${q.id}',${o.v})"`}><span>${o.label}</span></div>`;
  }).join("");
  zone.innerHTML = `
    <div class="tfbtns">${opts}</div>
    ${submitted ? verdictBlock(q, r) : `
    <div class="scoreline">
      <button class="btn primary" ${picked === null ? "disabled" : ""} onclick="submitTF('${q.id}')">提交答案</button>
      ${picked === null ? `<span class="hint">先选「对」或「错」</span>` : ""}
    </div>`}`;
}

function pickTF(qid, v) { window._pick[qid] = v; renderZone(QMAP[qid]); }
function submitTF(qid) {
  const q = QMAP[qid];
  const choice = window._pick[qid];
  if (choice === null || choice === undefined) return;
  record[qid] = { mode: "done", kind: "tf", choice, correct: choice === q.answer, ts: Date.now() };
  save(); refresh();
  toastChoice(qid);
}

/* ── 代码题 ── */
function renderCode(zone, q) {
  const r = record[q.id];
  const submitted = r && r.mode === "done";
  if (q.kind === "write") {
    if (!submitted) {
      zone.innerHTML = `
        <div class="hint">① 本地跑代码（<code>python -X utf8 你的脚本.py</code> 或粘进交互式环境）；② 下面两个框分别贴<b>代码</b>和<b>运行输出</b>。</div>
        <textarea class="answer mono tall" id="ta-${q.id}" placeholder="# 在这里贴你的代码…"></textarea>
        <div class="hint" style="margin-top:10px">运行输出（自动判分的依据）：</div>
        <textarea class="answer mono" id="out-${q.id}" style="min-height:60px" placeholder="例如：945"></textarea>
        <div class="scoreline">

        </div>`;
    } else {
      zone.innerHTML = `
        <div class="compare">
          <div class="col"><h5>你的代码</h5><div class="txt">${esc(r.code || "（空）")}</div></div>
          <div class="col"><h5>你的输出</h5><div class="txt">${esc(r.output || "（空）")}</div></div>
        </div>
        ${verdictBlock(q, r)}`;
    }
    return;
  }
  // predict
  if (!submitted) {
    zone.innerHTML = `
      <div class="hint">你的预测输出（<b>先别运行</b>，想清楚再写；拿不准可以运行验证）：</div>

        <span class="hint">按数字序列比对，格式差异不影响判分</span>
      </div>`;
  } else {
    zone.innerHTML = `
      <div class="compare">
        <div class="col"><h5>你的预测</h5><div class="txt">${esc(r.output || "（空）")}</div></div>
        <div class="col"><h5>实际输出</h5><div class="txt">${esc(q.expected)}</div></div>
      </div>
      ${verdictBlock(q, r)}`;
  }
}

function submitCode(qid) {
  const q = QMAP[qid];
  const out = document.getElementById("out-" + qid);
  const ta = document.getElementById("ta-" + qid);
  const output = out ? out.value.trim() : "";
  if (!output) { toast("先填运行输出再提交"); return; }
  record[qid] = {
    mode: "done", kind: "code", output,
    code: ta ? ta.value.trim() : "",
    correct: gradeOutput(output, q.expected),
    ts: Date.now()
  };
  save(); refresh();
  toastChoice(qid);
}

/* ── 客观题结果横幅 ── */
function verdictBlock(q, r) {
  const pass = r.correct;
  let head = "";
  if (q.type === "mc") {
    head = pass
      ? `<b class="pass-t">✓ 答对</b> —— 选了 ${"ABCD"[r.choice]}，正确。`
      : `<b class="fail-t">✗ 答错</b> —— 你选了 ${"ABCD"[r.choice]}，正确答案是 <b>${"ABCD"[q.correct]}</b>。`;
  } else if (q.type === "tf") {
    head = pass
      ? `<b class="pass-t">✓ 答对</b> —— 正确，这句话是<b>${q.answer ? "对的" : "错的"}</b>。`
      : `<b class="fail-t">✗ 答错</b> —— 这句话是<b>${q.answer ? "对的" : "错的"}</b>，你判成了${q.answer ? "错的" : "对的"}。`;
  } else {
    head = pass
      ? `<b class="pass-t">✓ 输出正确</b>`
      : `<b class="fail-t">✗ 输出不符</b> —— 实际输出：<code>${esc(q.expected)}</code>`;
  }
  return `
    <div class="verdict ${pass ? "pass" : "fail"}">
      <div>${head} <button class="btn" style="margin-left:8px" onclick="retry('${q.id}')">🔁 再试一次</button></div>
      <div class="exp"><h4 style="color:var(--accent);font-size:13px;margin-bottom:6px">为什么</h4>${q.explain}</div>
    </div>
    ${kmapBlock(q)}`;
}

/* ── 问答题 ── */
function renderQA(zone, q) {
  const r = record[q.id] || {};

  if (!submitted) {

function refBlock(q) {
  if (q.type === "qa") {
    return `

        <div class="body">${q.ref}</div>

  }
  return `
    <div class="ref">

/* ── 动作 ── */
function markSeen(qid) {

function retry(qid) {

}
function submitSelf(qid) {
  const q = QMAP[qid];
  const ta = document.getElementById("ta-" + qid);
  const ans = ta ? ta.value.trim() : "";
  if (!ans) { toast("先写点东西再对答案 :)"); return; }
  const prev = record[qid];
  record[qid] = {
    mode: "done", kind: "qa", answer: ans,
    points: (prev && prev.points && prev.answer === ans) ? prev.points : q.points.map(() => false),
    ts: Date.now()
  };
  save();
  renderZone(q);
  document.getElementById("zone-" + qid).scrollIntoView({ behavior: "smooth", block: "nearest" });
  refresh();
}
function togglePoint(qid, i, val) {
  const q = QMAP[qid];
  record[qid].points[i] = val;
  save();
  const zone = document.getElementById("zone-" + qid);
  const div = zone.querySelector(".compare");
  if (div) {
    const hit = record[qid].points.filter(Boolean).length;
    div.querySelectorAll("label")[i].className = val ? "hit" : "miss";
    const sl = zone.querySelector(".score-big");
    if (sl) sl.textContent = hit + "/" + q.points.length;
    else {
      const line = zone.querySelector(".scoreline .hint");
      if (line) line.outerHTML = `<span class="score-big">${hit}/${q.points.length}</span><span class="hint">诚实勾选——错的地方才是下次学习的入口</span>`;
    }
  }
  renderOverall(); renderTabs();
}

function chipCls(qid) {

  return r.correct ? " c-ok" : " c-bad";
}

/* ── 导出 & 重置 ── */
function exportRecord() {
  const lines = ["# Pointcept 全程复习（Step 0→5）· 学习记录", "导出时间：" + new Date().toLocaleString(), ""];
  GROUPS.forEach(g => {
    if (!g.questions.length) return;
    lines.push("## " + g.name);
    g.questions.forEach(q => {
      const r = record[q.id];
      const tag = `[${q.id}|${TYPE_NAME[q.type]}]`;
      if (!r) { lines.push(`- ${tag} ${q.title} —— ⬜ 未做`); return; }
      if (r.mode === "seen") { lines.push(`- ${tag} ${q.title} —— 👀 看了答案`); return; }
      if (r.kind === "mc") {
        lines.push(`- ${tag} ${q.title} —— ${r.correct ? "✓ 答对" : "✗ 答错"}（选了 ${"ABCD"[r.choice]}，正确 ${"ABCD"[q.correct]}）`);
      } else if (r.kind === "tf") {
        lines.push(`- ${tag} ${q.title} —— ${r.correct ? "✓ 答对" : "✗ 答错"}（判了「${r.choice ? "对" : "错"}」，正确「${q.answer ? "对" : "错"}」）`);
      } else if (r.kind === "code") {
        lines.push(`- ${tag} ${q.title} —— ${r.correct ? "✓ 输出正确" : "✗ 输出不符"}（我的输出：${(r.output || "").replace(/\n/g, " ")}；标准：${q.expected}）`);
        if (r.code) lines.push(`  - 我的代码：${r.code.replace(/\n/g, " ⏎ ")}`);
      } else {
        const hit = r.points ? r.points.filter(Boolean).length + "/" + r.points.length : "未自评";
        lines.push(`- ${tag} ${q.title} —— ✍ 自测 ${hit}`);
        lines.push(`  - 我的答案：${(r.answer || "").replace(/\n/g, " ")}`);
        const missed = q.points.filter((p, i) => r.points && !r.points[i]);
        if (missed.length) lines.push(`  - 未命中要点：${missed.join("；")}`);
      }
    });
    lines.push("");
  });
  const txt = lines.join("\n");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(
      () => toast("已复制到剪贴板，直接粘贴给 Claude 对答案 ✓"),
      () => downloadTxt(txt)
    );
  } else downloadTxt(txt);
}
function downloadTxt(txt) {

/* 去掉 HTML 标签，把实体解码成纯文本给 claude 当上下文 */
function htmlToText(html) {
  const d = document.createElement("div");
  d.innerHTML = String(html)
    .replace(/<br\s*\/?>/gi, "\n")
    .replace(/<\/(p|div|li|h\d|pre|table|tr)>/gi, "\n");
  return (d.textContent || "").replace(/\n{3,}/g, "\n\n").trim();
}

/* 每个问答窗口附带的页面上下文：让 claude 知道用户在看什么 */
function chatContext(kind, id) {
  if (kind === "lesson") {
    const g = GROUPS.find(x => x.id === id);
    if (!g || !g.lesson) return "";
    return "用户正在看复习站第「" + g.name + "」章的讲解：《" + g.lesson.title + "》。讲解正文：\n" + htmlToText(g.lesson.html).slice(0, 6000);
  }
  const q = QMAP[id];
  if (!q) return "";
  const r = record[id];
  const answered = r && r.mode === "done";
  let ctx = "用户正在做复习站的题目 " + id + "（" + TYPE_NAME[q.type] + " · 第「" +
    (GROUPS.find(x => x.id === q.gid) || {}).name + "」章）：" + q.title + "\n题面：" + htmlToText(q.prompt);
  if (q.code) ctx += "\n题目代码：\n" + q.code;
  if (q.options) ctx += "\n选项：" + q.options.map((o, i) => "ABCD"[i] + ". " + htmlToText(o)).join("  ");
  if (q.kmap) ctx += "\n该题知识定位：" + q.kmap.stage + "，代码位置 " + q.kmap.where;
  ctx += answered
    ? "\n用户已提交过这道题（" + (r.correct ? "答对了" : r.kind === "qa" ? "问答自评" : "答错了") + "），可以放开讲答案与解析。解析原文：" + htmlToText(q.explain || q.ref || "").slice(0, 2500)
    : "\n注意：用户还没作答这道题——先给提示和思路引导，不要直接说出最终答案；用户明确要答案时再给。";
  return ctx;
}

/* 极简 markdown → HTML（esc 后补粗体/行内代码/代码块/列表），只求够用 */
function mdLite(src) {
  const escd = esc(src);
  const blocks = [];
  let s = escd.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => {
    blocks.push("<pre><code>" + code.replace(/\n$/, "") + "</code></pre>");
    return "\x00BLOCK" + (blocks.length - 1) + "\x00";
  });
  s = s.replace(/^#{1,4}\s+(.+)$/gm, "<h4>$1</h4>")
       .replace(/^[-*]\s+(.+)$/gm, "<li>$1</li>")
       .replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, m => "<ul>" + m + "</ul>")
       .replace(/`([^`\n]+)`/g, "<code>$1</code>")
       .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  const paras = s.split(/\n{2,}/).map(p => {
    const t = p.trim();
    if (!t) return "";
    if (/^<h4|^<ul|^<pre/.test(t) || /^\x00BLOCK\d+\x00$/.test(t)) return t;
    return "<p>" + t.replace(/\n/g, "<br>") + "</p>";
  }).join("");
  return paras.replace(/\x00BLOCK(\d+)\x00/g, (m, i) => blocks[+i]);
}

function chatMsgHtml(m) {
  if (m.role === "user") return `<div class="cmsg user">${esc(m.text)}</div>`;
  if (m.role === "err") return `<div class="cmsg err">⚠ ${esc(m.text)}</div>`;
  return `<div class="cmsg bot"><div class="who">claude ·</div>${mdLite(m.text)}</div>`;
}

function chatBlock(kind, id) {
  const key = kind + ":" + id;
  const st = chatState(key);
  const title = kind === "lesson" ? "💬 关于本章讲解提问" : "💬 关于这道题提问";
  const sub = st.msgs.length ? st.msgs.length + " 条对话" : "问题会连同本题内容一起发给 Claude";
  return `
  <div class="chatbox${st.open ? " open" : ""}" id="chat-${kind}-${id}">
    <div class="chatbox-head" onclick="toggleChat('${kind}','${id}')">
      <span>${title}</span><span class="sub">${sub}</span><span class="chev">▶</span>
    </div>
    <div class="chatbox-body" id="chatbody-${kind}-${id}"></div>
  </div>`;
}

function renderChatBody(kind, id) {
  const body = document.getElementById("chatbody-" + kind + "-" + id);
  if (!body) return;
  const st = chatState(kind + ":" + id);
  if (window._chatOk === false) {          // 探测确认不在：降级提示（探测没回来之前先乐观显示输入框）
    body.innerHTML = `
      <div class="cmsg err" style="margin-top:10px">问答服务未连接。想用 💬 提问窗口：在仓库目录跑
        <code>python -X utf8 review_server.py</code>（替代原来的 <code>python -m http.server 8765</code>），
        然后浏览器访问 <code>http://127.0.0.1:8765/step_all_review.html</code> 并 Ctrl+F5。直接双击打开本文件时问答不可用，做题不受影响。</div>`;
    return;
  }
  const msgsHtml = st.msgs.length
    ? `<div class="chat-msgs" id="chatmsgs-${kind}-${id}">${st.msgs.map(chatMsgHtml).join("")}</div>`
    : `<div class="chat-empty-hint">直接用中文问，比如「这个概念用 WebGL 里的话怎么理解？」——回答会带着本章/本题的上下文，也可以让它读仓库代码核实。</div>
       <div class="chat-msgs" id="chatmsgs-${kind}-${id}"></div>`;
  body.innerHTML = `
    ${msgsHtml}
    <div class="chatbar">
      <textarea id="chatin-${kind}-${id}" rows="2" placeholder="你的问题…（Enter 发送 / Shift+Enter 换行）"
        onkeydown="chatKeydown(event,'${kind}','${id}')"></textarea>
      <button class="send" id="chatsend-${kind}-${id}" onclick="sendChat('${kind}','${id}')">发送</button>
    </div>`;
  const box = body.querySelector(".chat-msgs");
  if (box) box.scrollTop = box.scrollHeight;
}

function toggleChat(kind, id) {
  const st = chatState(kind + ":" + id);
  st.open = !st.open;
  const el = document.getElementById("chat-" + kind + "-" + id);
  if (el) el.classList.toggle("open", st.open);
  if (st.open) {
    renderChatBody(kind, id);
    const ta = document.getElementById("chatin-" + kind + "-" + id);
    if (ta && !st.msgs.length) ta.focus();
  }
}

function chatKeydown(ev, kind, id) {
  if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); sendChat(kind, id); }
}

function setChatBusy(kind, id, busy) {
  window._chatBusy = busy;
  const btn = document.getElementById("chatsend-" + kind + "-" + id);
  if (btn) { btn.disabled = busy; btn.textContent = busy ? "思考中…" : "发送"; }
  const ta = document.getElementById("chatin-" + kind + "-" + id);
  if (ta) ta.disabled = busy;
}

async function sendChat(kind, id) {
  const ta = document.getElementById("chatin-" + kind + "-" + id);
  if (!ta || window._chatBusy) return;
  const text = ta.value.trim();
  if (!text) return;
  const st = chatState(kind + ":" + id);
  st.msgs.push({ role: "user", text });
  ta.value = "";
  setChatBusy(kind, id, true);
  const msgsBox = document.getElementById("chatmsgs-" + kind + "-" + id);
  const wait = document.createElement("div");
  if (msgsBox) {
    wait.className = "chat-wait";
    wait.innerHTML = "claude 正在答<span class=\"dots\"></span>（它会带着本题上下文、必要时读仓库代码核实，一般几秒到几十秒）";
    msgsBox.appendChild(wait);
    msgsBox.scrollTop = msgsBox.scrollHeight;
  }
  try {
    const res = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        question: text,
        context: chatContext(kind, id),
        history: st.msgs.slice(-8, -1).map(m => (m.role === "user" ? "问：" : "答：") + m.text).join("\n").slice(-4000)
      })
    });
    const data = await res.json();
    wait.remove();
    if (data.ok) st.msgs.push({ role: "bot", text: data.answer });
    else st.msgs.push({ role: "err", text: data.error || "未知错误" });
  } catch (e) {
    wait.remove();
    st.msgs.push({ role: "err", text: "请求失败：" + e.message + "——问答服务挂了？看服务器窗口的报错" });
  } finally {
    setChatBusy(kind, id, false);
    renderChatBody(kind, id);
    const box2 = document.getElementById("chatmsgs-" + kind + "-" + id);
    if (box2) box2.scrollTop = box2.scrollHeight;
  }
}

/* 启动探测 /ask 在不在：在 → 开问答；不在 → 静默降级（控制台留一句） */
(async function probeChat() {
  try {
    const res = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ probe: true })
    });
    const data = await res.json();
    window._chatOk = !!data.ok;
    if (!window._chatOk) console.warn("[chat] 问答服务在但不可用：", data.error);
  } catch (e) {
    window._chatOk = false;
    console.warn("[chat] 问答服务未连接（双击打开或纯静态服务器）——💬 窗口显示降级提示，做题不受影响");
  }
})();

refresh();
</script>
